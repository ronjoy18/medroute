{% extends "base.html" %}

{% block content %}
<nav class="clinical-nav">
    <a href="/" class="brand">Medroute <span style="color: var(--secondary-teal);">Diagnostics</span></a>
    <div>
      {% if request.user.is_authenticated %}
        <span style="margin-right: 1rem; font-weight: 600;">
          {{ request.user.get_full_name|default:request.user.username }} [{{ request.user.get_role_display }}]
        </span>
        <a href="/dashboard/" class="clinical-btn btn-outline" style="margin-right: 0.5rem;">Console</a>
        <button onclick="fetch('/api/v1/auth/logout/', {method:'POST', headers:{'X-CSRFToken':'{{ csrf_token }}'}}).then(()=>window.location.href='/')" class="clinical-btn btn-primary">Sign Out</button>
      {% else %}
        <!--a href="/auth/?mode=login&role=doctor" class="clinical-btn btn-outline" style="margin-right: 0.5rem;">Doctor Portal</a>-->
        <div class ="auth-btn">
          <a href="/auth/?mode=register&role=patient" class=" btn-phone">sign up</a>
          <a href="/auth/?mode=login&role=patient" class=" btn-primary">login</a>
        </div>
      {% endif %}
    </div>
</nav>
