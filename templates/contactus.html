{% extends "base.html" %}

{% block content %}
<div class="card" style="margin-bottom: 1.5rem;">
  <h1 style="color: var(--primary-deep); margin-bottom: 0.5rem;">Caregiver Services</h1>
  <p style="color: #64748B;">Select a home errand or companionship service. Our team will contact you directly to confirm schedule and location details.</p>
</div>

<!-- Toast Container -->
<div id="patient-toast-notification" style="display: none; position: fixed; top: 1.5rem; right: 1.5rem; z-index: 99999; background: #ECFDF5; border: 1px solid #6EE7B7; color: #065F46; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); align-items: center; gap: 0.75rem;">
  <span style="font-size: 1.25rem;">✓</span>
  <div>
    <strong id="toast-title">Request Submitted</strong>
    <p id="toast-message" style="font-size: 0.85rem; margin: 0; color: #047857;"></p>
  </div>
</div>

<div class="card" style="margin-bottom: 2rem;">
  <form id="care-request-form" style="display: flex; flex-direction: column; gap: 1rem;">
    <div style="position: relative;">
      <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.35rem;">Search a Service</label>
      <input type="text" id="service-search-input" placeholder="Type to search service (e.g. Companion, Errands)..." style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-slate); border-radius: 6px;" autocomplete="off">
      <div id="service-search-results" style="max-height: 180px; overflow-y: auto; border: 1px solid var(--border-slate); border-radius: 6px; display: none; background: #FFF; margin-top: 4px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: absolute; width: 100%; z-index: 10;"></div>
    </div>

    <!-- Selected Service Container -->
    <div id="selected-service-badge" style="min-height: 36px;"></div>

    <button type="submit" id="submit-request-btn" class="clinical-btn btn-primary" style="width: 100%; padding: 0.75rem;">Submit Request</button>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function getCsrfToken() {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, 10) === "csrftoken=") {
          cookieValue = decodeURIComponent(cookie.substring(10));
          break;
        }
      }
    }
    return cookieValue || "{{ csrf_token }}";
  }

  function showToastAndRedirect(title, message, redirectUrl) {
    const toast = document.getElementById("patient-toast-notification");
    if (!toast) {
      window.location.href = redirectUrl;
      return;
    }
    document.getElementById("toast-title").textContent = title;
    document.getElementById("toast-message").textContent = message;
    toast.style.display = "flex";

    setTimeout(() => {
      window.location.href = redirectUrl;
    }, 1500);
  }

  let catalog = [];
  let selectedService = null;

  document.addEventListener("DOMContentLoaded", async () => {
    const searchInput = document.getElementById("service-search-input");
    const resultsBox = document.getElementById("service-search-results");
    const badgeBox = document.getElementById("selected-service-badge");
    const requestForm = document.getElementById("care-request-form");
    const submitBtn = document.getElementById("submit-request-btn");

    // 1. Fetch catalog options
    try {
      const res = await fetch("/api/v1/catalog/");
      if (res.ok) {
        catalog = await res.json();
      }
    } catch (e) {
      console.error("Could not load services:", e);
    }

    // 2. Real-time search filtering
    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase().trim();
      if (!query) {
        resultsBox.style.display = "none";
        resultsBox.innerHTML = "";
        return;
      }

      const filtered = catalog.filter(item => (item.name || "").toLowerCase().includes(query));
      resultsBox.innerHTML = "";

      if (filtered.length === 0) {
        resultsBox.innerHTML = "<div style='padding: 10px; font-size: 0.85rem; color: #64748B;'>No matching services found.</div>";
      } else {
        filtered.forEach(item => {
          const div = document.createElement("div");
          div.style.padding = "10px";
          div.style.cursor = "pointer";
          div.style.borderBottom = "1px solid #F1F5F9";
          div.style.fontSize = "0.9rem";
          div.innerHTML = `<strong>${item.name}</strong> - <span style="color: var(--secondary-teal); font-weight: 600;">Ksh ${item.price}</span>`;
          
          div.addEventListener("click", () => {
            selectedService = item;
            renderBadge();
            resultsBox.style.display = "none";
            searchInput.value = "";
          });
          resultsBox.appendChild(div);
        });
      }
      resultsBox.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
        resultsBox.style.display = "none";
      }
    });

    function renderBadge() {
      if (!selectedService) {
        badgeBox.innerHTML = "";
        return;
      }
      badgeBox.innerHTML = `
        <div style="background: #E0F2FE; color: var(--primary-deep); font-size: 0.85rem; padding: 6px 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px;">
          <span>Selected: <strong>${selectedService.name}</strong> (Ksh ${selectedService.price})</span>
          <b style="cursor: pointer; color: #EF4444;" onclick="clearSelected()">&times;</b>
        </div>
      `;
    }

    window.clearSelected = function() {
      selectedService = null;
      renderBadge();
    };

    // 3. Form Submit -> Post to API -> Trigger Redirect
    requestForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      // Check auth from body tag
      const isAuthenticated = document.body.dataset.authenticated === "true";
      if (!isAuthenticated) {
        window.location.href = "{% url 'auth-page' %}?next=" + encodeURIComponent(window.location.pathname);
        return;
      }

      if (!selectedService) {
        alert("Please search and select a service from the list.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering Request...";

      try {
        const response = await fetch("/api/v1/care-connect/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCsrfToken()
          },
          body: JSON.stringify({
            service_id: selectedService.id
          })
        });

        // Backend auth fallback check
        if (response.status === 401 || response.status === 403) {
          window.location.href = "{% url 'auth-page' %}?next=" + encodeURIComponent(window.location.pathname);
          return;
        }

        const data = await response.json();

        if (response.ok) {
          showToastAndRedirect(
            "Request Received!",
            "Your caregiver errand request has been logged.",
            data.redirect_url || "/caregiver/thank-you/"
          );
        } else {
          alert(data.detail || "Submission could not be completed.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Request";
        }
      } catch (err) {
        alert("Network communication error. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Request";
      }
    });
  });
</script>
{% endblock %}
